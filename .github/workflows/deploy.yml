name: Deploy

# Staged rollout for Azure Container Apps:
#   build → migrate (separate job, MIGRATE_ON_BOOT stays false) → new revision
#   with 0% traffic → wait for /readyz → shift 100% traffic.
# Requires the repository secrets and OIDC federated credential described in
# DEPLOYMENT.md and a Container App already provisioned by deploy/provision.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_NAME: ${{ vars.AZURE_APP_NAME }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  migrate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          docker run --rm \
            -e DATABASE_URL -e JWT_SECRET \
            "$IMAGE" -migrate-only

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: create revision (0% traffic)
        id: revision
        run: |
          SUFFIX="r$(echo "${GITHUB_SHA}" | cut -c1-10)"
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --revision-suffix "$SUFFIX" \
            --output none
          echo "name=${APP_NAME}--${SUFFIX}" >> "$GITHUB_OUTPUT"
      - name: wait for /readyz on the new revision
        id: ready
        run: |
          REVISION="${{ steps.revision.outputs.name }}"
          FQDN=$(az containerapp revision show \
            --name "$REVISION" --resource-group "$RESOURCE_GROUP" \
            --query properties.fqdn -o tsv)
          echo "revision fqdn: ${FQDN}"
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://${FQDN}/readyz" || true)
            echo "attempt ${i}: /readyz -> ${CODE}"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::new revision never became ready"
          exit 1
      - name: shift traffic to the new revision
        run: |
          az containerapp ingress traffic set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision-weight "${{ steps.revision.outputs.name }}=100" \
            --output none
      - name: deactivate a unhealthy revision after failure
        if: failure()
        run: |
          REVISION="${{ steps.revision.outputs.name }}"
          if [ -n "$REVISION" ]; then
            az containerapp revision deactivate \
              --name "$REVISION" --resource-group "$RESOURCE_GROUP" || true
          fi
